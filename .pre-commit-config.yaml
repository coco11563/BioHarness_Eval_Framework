repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The canonical run snapshot under output/pipeline/ ships per-item
        # records for all 21,752 items; the largest (bioasq.jsonl) is ~4.4 MB.
        args: [--maxkb=5120]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbidden-strings
        name: forbidden-strings (release-grade phrasing)
        entry: python scripts/scan_forbidden_strings.py
        language: system
        pass_filenames: true
        types: [text]
        stages: [pre-commit, pre-push, commit-msg]
