# ---------------------------------------------------------------------------
# Verification matrix
# ---------------------------------------------------------------------------
# Two operating modes for verify.py:
#
#   offline (default): no network, no GPU. Reads dataset + run.jsonl from
#     local disk, replays the evaluator, and asserts byte-equal CSVs against
#     the golden hashes. Must pass deterministically on supported platforms.
#
#   --live           : re-runs the headline method end-to-end. Tolerance bands
#     accommodate stochastic LLM behaviour. Requires the BYO infrastructure
#     documented in docs/infra.md.
[verify.offline]
total_items          = 19302
csv_byte_equal       = true
# Supported Python interpreters. The exact pin used by verify.py is in
# `pyproject.toml` and `uv.lock`; this field only documents the range under
# which the golden CSV bytes are guaranteed.
python_support_range = ">=3.10,<3.13"
supported_platforms  = ["linux-x86_64", "linux-aarch64", "darwin-arm64"]

[verify.live]
total_items              = 19302
accuracy_tolerance_pp    = 2.5
max_per_item_flip_rate   = 0.05
slice_binomial_se_check  = true
note = "Live mode tolerances are derived from binomial standard error at n=19,302 (1.96·√(p(1-p)/n)·100 ≈ 0.6 pp at p=0.766) plus a 4× headroom for backend stochasticity. Live mode requires user-provided infrastructure documented in docs/infra.md."

# ---------------------------------------------------------------------------
# Release provenance (sources of the code that interprets this manifest)
# ---------------------------------------------------------------------------
# `release-provenance.toml` is generated by the release-prep script (see
# scripts/build_release_provenance.py, shipped in A1) and pins:
#   - the framework source archive commit
#   - sha256 of every file in src/{framework}/eval/**
#   - sha256 of verify.py
# verify.py loads it before scoring and refuses to proceed on a hash mismatch.
# The hash below is filled at the time `release-provenance.toml` is frozen.
[provenance]
relative_path = "release-provenance.toml"
sha256        = "TBD-SET-ON-FIRST-RELEASE"
status        = "deferred-to-future-release"
note          = "Empty placeholder until the release-prep script ships. verify.py treats `TBD-*` as a skip for pre-1.0 releases and as a hard failure for any tagged release."
